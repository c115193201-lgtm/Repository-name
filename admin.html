

<!DOCTYPE html>

<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DrinkHelper 店家管理後台</title>

<style>

* {

    box-sizing: border-box;

}

body {

    margin: 0;

    font-family: Arial, "Microsoft JhengHei", sans-serif;

    background: #f7f3ef;

    color: #49372d;

}

header {

    background: #8b6046;

    color: white;

    padding: 25px;

    text-align: center;

}

header h1 {

    margin: 0;

}

header p {

    margin-bottom: 0;

}

.container {

    max-width: 1100px;

    margin: 25px auto;

    padding: 15px;

}

.stats {

    display: grid;

    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));

    gap: 15px;

}

.card {

    background: white;

    padding: 22px;

    border-radius: 12px;

    box-shadow: 0 3px 10px #00000010;

}

.card h3 {

    color: #8b6046;

    margin-top: 0;

}

.number {

    font-size: 30px;

    font-weight: bold;

}

.section {

    background: white;

    margin-top: 25px;

    padding: 22px;

    border-radius: 12px;

    overflow-x: auto;

}

h2 {

    color: #8b6046;

}

table {

    width: 100%;

    border-collapse: collapse;

    min-width: 750px;

}

th, td {

    padding: 13px;

    text-align: center;

    border-bottom: 1px solid #eee;

}

th {

    background: #fff3e6;

}

select {

    padding: 8px;

    border-radius: 7px;

    border: 1px solid #ddd;

}

button {

    padding: 9px 13px;

    border: none;

    border-radius: 7px;

    background: #8b6046;

    color: white;

    cursor: pointer;

}

button:hover {

    background: #68452f;

}

.delete {

    background: #c65b50;

}

.empty {

    text-align: center;

    color: #999;

    padding: 25px;

}

footer {

    text-align: center;

    padding: 20px;

    color: #888;

}

</style>

</head>

<body>

<header>

    <h1>🏪 DrinkHelper 店家管理後台</h1>

    <p>訂單管理與營業狀況總覽</p>

</header>

<div class="container">

    <div class="stats">

        <div class="card">

            <h3>📋 今日訂單</h3>

            <div class="number" id="totalOrders">0</div>

            <p>累積訂單數量</p>

        </div>

        <div class="card">

            <h3>💰 今日營業額</h3>

            <div class="number" id="totalMoney">$0</div>

            <p>已接收訂單金額</p>

        </div>

        <div class="card">

            <h3>⏳ 待處理訂單</h3>

            <div class="number" id="pendingOrders">0</div>

            <p>等待店家處理</p>

        </div>

        <div class="card">

            <h3>✅ 已完成訂單</h3>

            <div class="number" id="finishedOrders">0</div>

            <p>完成製作的訂單</p>

        </div>

    </div>

    <div class="section">

        <h2>📦 顧客訂單管理</h2>

        <button onclick="loadOrders()">🔄 重新整理訂單</button>

        <table>

            <thead>

                <tr>

                    <th>訂單編號</th>

                    <th>顧客姓名</th>

                    <th>飲料名稱</th>

                    <th>甜度</th>

                    <th>冰量</th>

                    <th>容量</th>

                    <th>配料</th>

                    <th>數量</th>

                    <th>金額</th>

                    <th>備註</th>

                    <th>訂單狀態</th>

                    <th>操作</th>

                </tr>

            </thead>

            <tbody id="orderList">

                <tr>

                    <td colspan="12" class="empty">

                        目前沒有訂單

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

    <div class="section">

        <h2>📊 訂單狀態說明</h2>

        <p>🟡 待處理：顧客剛送出的訂單</p>

        <p>🔵 製作中：店家正在準備飲料</p>

        <p>🟢 已完成：飲料製作完成</p>

        <p>🔴 已取消：訂單取消</p>

    </div>

</div>

<footer>

    DrinkHelper 智慧飲料店 © 2026

</footer>

<script>

// 讀取訂單資料

function getOrders() {

    return JSON.parse(localStorage.getItem("drinkOrders") || "[]");

}

// 儲存訂單資料

function saveOrders(orders) {

    localStorage.setItem("drinkOrders", JSON.stringify(orders));

}

// 顯示訂單

function loadOrders() {

    const orders = getOrders();

    const list = document.getElementById("orderList");

    list.innerHTML = "";

    if (orders.length === 0) {

        list.innerHTML = `

            <tr>

                <td colspan="12" class="empty">

                    目前沒有訂單

                </td>

            </tr>

        `;

    }

    orders.forEach((order, index) => {

        const row = document.createElement("tr");

        const values = [

            order.id || index + 1,

            order.customer,

            order.drink,

            order.sugar,

            order.ice,

            order.size,

            order.topping,

            order.quantity,

            "$" + order.total,

            order.note || "無"

        ];

        values.forEach(value => {

            const cell = document.createElement("td");

            cell.textContent = value ?? "";

            row.appendChild(cell);

        });

        const statusCell = document.createElement("td");

        const statusSelect = document.createElement("select");

        ["待處理", "製作中", "已完成", "已取消"].forEach(status => {

            const option = document.createElement("option");

            option.value = status;

            option.textContent = status;

            statusSelect.appendChild(option);

        });

        statusSelect.value = order.status || "待處理";

        statusSelect.addEventListener("change", function() {

            const latestOrders = getOrders();

            latestOrders[index].status = this.value;

            saveOrders(latestOrders);

            loadOrders();

        });

        statusCell.appendChild(statusSelect);

        row.appendChild(statusCell);

        const actionCell = document.createElement("td");

        const deleteButton = document.createElement("button");

        deleteButton.textContent = "刪除";

        deleteButton.className = "delete";

        deleteButton.addEventListener("click", function() {

            if (confirm("確定要刪除這筆訂單嗎？")) {

                const latestOrders = getOrders();

                latestOrders.splice(index, 1);

                saveOrders(latestOrders);

                loadOrders();

            }

        });

        actionCell.appendChild(deleteButton);

        row.appendChild(actionCell);

        list.appendChild(row);

    });

    // 統計訂單

    const validOrders = orders.filter(

        order => order.status !== "已取消"

    );

    const totalMoney = validOrders.reduce(

        (sum, order) => sum + Number(order.total || 0), 0

    );

    const pending = orders.filter(

        order => !order.status || order.status === "待處理"

    ).length;

    const finished = orders.filter(

        order => order.status === "已完成"

    ).length;

    document.getElementById("totalOrders").textContent =

        orders.length;

    document.getElementById("totalMoney").textContent =

        "$" + totalMoney;

    document.getElementById("pendingOrders").textContent =

        pending;

    document.getElementById("finishedOrders").textContent =

        finished;

}

// 每三秒重新整理

loadOrders();

setInterval(loadOrders, 3000);

</script>

</body>

</html>
