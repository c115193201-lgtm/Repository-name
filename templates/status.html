<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>訂單狀態查詢 - DrinkHelper</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow p-4 text-center" style="width: 450px;">
        <h3 class="mb-3">📋 訂單追蹤狀態</h3>
        <p class="text-muted">請妥善保存此頁面網址或 Token 以查詢訂單最新狀態。</p>
        
        <div class="card bg-white p-3 mb-3 text-start border">
            <p class="mb-1"><strong>品項：</strong>{{ order.drink_name }} x {{ order.quantity }}</p>
            <p class="mb-1"><strong>金額：</strong>${{ order.total_price }}</p>
            <p class="mb-1"><strong>規格：</strong>{{ order.sugar }} / {{ order.ice }} / {{ order.size }} / {{ order.topping }}</p>
            <p class="mb-0"><strong>目前狀態：</strong><span id="order-status" class="badge bg-warning text-dark fs-6">{{ order.status }}</span></p>
        </div>

        <div id="notification" class="alert alert-info d-none">訂單狀態已更新！</div>

        <a href="/" class="btn btn-outline-primary">返回首頁繼續點餐</a>
    </div>

    <script>
        const token = "{{ order.token }}";
        let currentStatus = "{{ order.status }}";

        // 每 30 秒輪詢訂單狀態
        setInterval(() => {
            fetch(`/api/order/${token}`)
            .then(res => res.json())
            .then(data => {
                const statusBadge = document.getElementById('order-status');
                statusBadge.innerText = data.status;
                if (data.status !== currentStatus) {
                    currentStatus = data.status;
                    const notif = document.getElementById('notification');
                    notif.classList.remove('d-none');
                    notif.innerText = `通知：您的訂單狀態已變更為「${data.status}」`;
                }
            });
        }, 30000);
    </script>
</body>
</html>
