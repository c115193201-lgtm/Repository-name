<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrinkHelper 店家管理後台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #fdfbf7;
            color: #4a3b32;
            font-family: "Microsoft JhengHei", sans-serif;
        }
        .header-bg {
            background-color: #8c6d53;
            color: white;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }
        .card {
            border: none;
            border-radius: 16px;
            background-color: #ffffff;
            box-shadow: 0 4px 15px rgba(140, 109, 83, 0.08);
            transition: transform 0.2s;
        }
        .stat-card {
            background-color: #fcf4ec;
            border: 1px solid #f2e3d5;
            border-radius: 14px;
        }
        .btn-primary {
            background-color: #8c6d53;
            border-color: #8c6d53;
        }
        .btn-primary:hover {
            background-color: #735741;
            border-color: #735741;
        }
        .table-custom th {
            background-color: #f2e3d5;
            color: #4a3b32;
            border-top: none;
        }
    </style>
</head>
<body>
    <!-- 頂部標題區塊 -->
    <div class="header-bg text-center py-4 px-3 mb-4 shadow-sm">
        <h2 class="fw-bold mb-1">🏪 DrinkHelper 店家管理後台</h2>
        <p class="mb-0 text-light opacity-75">訂單管理與營業狀況總覽</p>
    </div>

    <div class="container mb-5">
        <!-- 數據統計看板 -->
        <div class="row g-3 mb-4">
            <div class="col-6 col-md-3">
                <div class="stat-card p-3 text-center shadow-sm">
                    <div class="text-muted fw-semibold small mb-1">📋 今日訂單</div>
                    <div class="fs-3 fw-bold text-dark" id="stat-total-count">0</div>
                    <div class="text-muted small mt-1">累積訂單數量</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-card p-3 text-center shadow-sm">
                    <div class="text-muted fw-semibold small mb-1">💰 今日營業額</div>
                    <div class="fs-3 fw-bold text-success" id="stat-total-revenue">$0</div>
                    <div class="text-muted small mt-1">已接收訂單金額</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-card p-3 text-center shadow-sm">
                    <div class="text-muted fw-semibold small mb-1">⏳ 待處理訂單</div>
                    <div class="fs-3 fw-bold text-warning" id="stat-pending-count">0</div>
                    <div class="text-muted small mt-1">等待店家處理</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-card p-3 text-center shadow-sm">
                    <div class="text-muted fw-semibold small mb-1">✅ 已完成訂單</div>
                    <div class="fs-3 fw-bold text-primary" id="stat-completed-count">0</div>
                    <div class="text-muted small mt-1">完成製作的訂單</div>
                </div>
            </div>
        </div>

        <!-- 顧客訂單管理區塊 -->
        <div class="card p-4 shadow-sm">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="fw-bold mb-0" style="color: #6e523b;">📦 顧客訂單管理</h4>
                <button class="btn btn-primary btn-sm fw-bold" onclick="location.reload()">🔄 重新整理訂單</button>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle table-custom">
                    <thead>
                        <tr>
                            <th>訂單編號</th>
                            <th>顧客姓名</th>
                            <th>品項內容</th>
                            <th>杯數/金額</th>
                            <th>甜度/冰塊</th>
                            <th>狀態</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="orders-table-body">
                        <!-- 動態載入訂單 -->
                        <tr>
                            <td colspan="7" class="text-center text-muted py-4">目前尚無訂單資料</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 這裡可依後端 API 串接實際訂單資料，目前維持預設框架與奶茶色互動
    </script>
</body>
</html>
