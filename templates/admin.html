<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrinkHelper 店家管理後台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #fdfbf7;
            color: #4a3b32;
            font-family: "Microsoft JhengHei", sans-serif;
        }
        .header-bg {
            background-color: #8c6d53;
            color: white;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }
        .card {
            border: none;
            border-radius: 16px;
            background-color: #ffffff;
            box-shadow: 0 4px 15px rgba(140, 109, 83, 0.08);
        }
        .stat-card {
            background-color: #fcf4ec;
            border: 1px solid #f2e3d5;
            border-radius: 14px;
        }
        .btn-primary {
            background-color: #8c6d53;
            border-color: #8c6d53;
        }
        .btn-primary:hover {
            background-color: #735741;
            border-color: #735741;
        }
        .table-custom th {
            background-color: #f2e3d5;
            color: #4a3b32;
            border-top: none;
        }
    </style>
</head>
<body>
    <!-- 頂部標題區塊 -->
    <div class="header-bg text-center py-4 px-3 mb-4 shadow-sm">
        <h2 class="fw-bold mb-1">🏪 DrinkHelper 店家管理後台</h2>
        <p class="mb-0 text-light opacity-75">訂單管理與營業狀況總覽</p>
    </div>

    <div class="container mb-5">
        <!-- 數據統計看板 -->
        <div class="row g-3 mb-4">
            <div class="col-6 col-md-3">
                <div class="stat-card p-3 text-center shadow-sm">
                    <div class="text-muted fw-semibold small mb-1">📋 今日訂單</div>
                    <div class="fs-3 fw-bold text-dark" id="stat-total-count">0</div>
                    <div class="text-muted small mt-1">累積訂單數量</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-card p-3 text-center shadow-sm">
                    <div class="text-muted fw-semibold small mb-1">💰 今日營業額</div>
                    <div class="fs-3 fw-bold text-success" id="stat-total-revenue">$0</div>
                    <div class="text-muted small mt-1">已接收訂單金額</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-card p-3 text-center shadow-sm">
                    <div class="text-muted fw-semibold small mb-1">⏳ 待處理訂單</div>
                    <div class="fs-3 fw-bold text-warning" id="stat-pending-count">0</div>
                    <div class="text-muted small mt-1">等待店家處理</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-card p-3 text-center shadow-sm">
                    <div class="text-muted fw-semibold small mb-1">✅ 已完成訂單</div>
                    <div class="fs-3 fw-bold text-primary" id="stat-completed-count">0</div>
                    <div class="text-muted small mt-1">完成製作的訂單</div>
                </div>
            </div>
        </div>

        <!-- 顧客訂單管理區塊 -->
        <div class="card p-4 shadow-sm">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="fw-bold mb-0" style="color: #6e523b;">📦 顧客訂單管理</h4>
                <button class="btn btn-primary btn-sm fw-bold" onclick="loadOrders()">🔄 重新整理訂單</button>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle table-custom">
                    <thead>
                        <tr>
                            <th>訂單編號</th>
                            <th>顧客姓名</th>
                            <th>品項與規格</th>
                            <th>杯數/金額</th>
                            <th>狀態</th>
                            <th>操作控制</th>
                        </tr>
                    </thead>
                    <tbody id="orders-table-body">
                        <tr>
                            <td colspan="6" class="text-center text-muted py-4">正在載入訂單資料...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function loadOrders() {
            // 從後端 API 取得所有訂單資料
            fetch('/api/admin/orders')
                .then(res => res.json())
                .then(data => {
                    const tbody = document.getElementById('orders-table-body');
                    tbody.innerHTML = '';

                    if (!data.orders || data.orders.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">目前尚無任何訂單</td></tr>`;
                        updateStats([]);
                        return;
                    }

                    let totalRevenue = 0;
                    let pendingCount = 0;
                    let completedCount = 0;

                    data.orders.forEach(order => {
                        totalRevenue += order.total_price;
                        if (order.status === '待處理') pendingCount++;
                        if (order.status === '已完成') completedCount++;

                        let statusBadgeClass = 'bg-warning text-dark';
                        if (order.status === '已完成') statusBadgeClass = 'bg-success text-white';
                        if (order.status === '已取消') statusBadgeClass = 'bg-danger text-white';

                        tbody.innerHTML += `
                            <tr>
                                <td><code>${order.token}</code></td>
                                <td class="fw-bold">${order.customer_name}</td>
                                <td>${order.drink_name}<br><small class="text-muted">${order.sugar} / ${order.ice} / ${order.size} / 加料:${order.topping}</small></td>
                                <td>${order.quantity} 杯<br><strong class="text-success">$${order.total_price}</strong></td>
                                <td><span class="badge ${statusBadgeClass}">${order.status}</span></td>
                                <td>
                                    <div class="btn-group btn-group-sm">
                                        <button class="btn btn-outline-success" onclick="updateStatus('${order.token}', '已完成')">完成</button>
                                        <button class="btn btn-outline-danger" onclick="updateStatus('${order.token}', '已取消')">取消</button>
                                    </div>
                                </td>
                            </tr>
                        `;
                    });

                    // 更新上方統計看板
                    document.getElementById('stat-total-count').innerText = data.orders.length;
                    document.getElementById('stat-total-revenue').innerText = `$${totalRevenue}`;
                    document.getElementById('stat-pending-count').innerText = pendingCount;
                    document.getElementById('stat-completed-count').innerText = completedCount;
                })
                .catch(err => {
                    console.log('載入訂單失敗');
                });
        }

        function updateStatus(token, newStatus) {
            fetch(`/api/admin/update_status/${token}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: newStatus })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    loadOrders(); // 重新整理列表
                } else {
                    alert('更新狀態失敗');
                }
            });
        }

        // 頁面載入時自動讀取，並每 5 秒自動更新後台數據
        loadOrders();
        setInterval(loadOrders, 5000);
    </script>
</body>
</html>
