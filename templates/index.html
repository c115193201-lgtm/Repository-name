<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>DrinkHelper - 智慧手搖飲訂閱平台</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f9fa;
            margin: 0;
            padding: 20px;
            color: #2c3e50;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            font-weight: bold;
            margin-right: 10px;
        }
        select, button {
            padding: 8px 12px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #3498db;
            color: white;
            cursor: pointer;
            border: none;
        }
        button:hover {
            background-color: #2980b9;
        }
        #result {
            margin-top: 15px;
            font-weight: bold;
            color: #e74c3c;
            font-size: 18px;
        }
        .menu-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .menu-table th, .menu-table td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
        .menu-table th {
            background-color: #34495e;
            color: white;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🥤 DrinkHelper 智慧手搖飲訂閱</h1>
            <p>為你量身打造的專屬手搖飲推薦與智慧菜單系統！</p>
        </header>

        <!-- 互動推薦區塊 -->
        <div class="card">
            <h3>🔍 智慧命定推薦（自訂甜度冰塊）</h3>
            <div class="form-group">
                <label for="sweetness">選擇甜度：</label>
                <select id="sweetness">
                    <option value="正常糖">正常糖</option>
                    <option value="少糖">少糖</option>
                    <option value="半糖">半糖</option>
                    <option value="微糖">微糖</option>
                    <option value="無糖">無糖</option>
                </select>
            </div>
            <div class="form-group">
                <label for="ice">選擇冰塊：</label>
                <select id="ice">
                    <option value="正常冰">正常冰</option>
                    <option value="少冰">少冰</option>
                    <option value="微冰">微冰</option>
                    <option value="去冰">去冰</option>
                    <option value="溫熱飲">溫熱飲</option>
                </select>
            </div>
            <button onclick="recommendDrink()">幫我推薦飲品！</button>
            <p id="result"></p>
        </div>

        <!-- 完整菜單區塊 -->
        <div class="card">
            <h3>📋 智慧連鎖手搖飲精選菜單</h3>
            <table class="menu-table">
                <tr>
                    <th>分類</th>
                    <th>飲品名稱</th>
                    <th>推薦甜度/冰塊</th>
                    <th>參考價格</th>
                </tr>
                <tr>
                    <td>咀嚼系</td>
                    <td>芋頭鮮奶波波</td>
                    <td>微糖 / 微冰</td>
                    <td>$65</td>
                </tr>
                <tr>
                    <td>清爽茶飲</td>
                    <td>四季春青茶 + 珍珠</td>
                    <td>無糖 / 去冰</td>
                    <td>$45</td>
                </tr>
                <tr>
                    <td>濃郁奶茶</td>
                    <td>鐵觀音拿鐵</td>
                    <td>微糖 / 少冰</td>
                    <td>$55</td>
                </tr>
                <tr>
                    <td>果茶特調</td>
                    <td>翡翠檸檬海燕窩</td>
                    <td>半糖 / 正常冰</td>
                    <td>$60</td>
                </tr>
            </table>
        </div>
    </div>

    <script>
        function recommendDrink() {
            const sweet = document.getElementById('sweetness').value;
            const ice = document.getElementById('ice').value;
            
            // 根據不同選擇提供多種選項池
            const options = [
                `【清爽解渴】${sweet}、${ice} 的「四季春青茶」`,
                `【咀嚼口感】${sweet}、${ice} 的「芋頭鮮奶波波」`,
                `【濃郁茶香】${sweet}、${ice} 的「鐵觀音拿鐵」`,
                `【酸甜果香】${sweet}、${ice} 的「翡翠檸檬海燕窩」`,
                【經典不敗】${sweet}、${ice} 的「珍珠奶茶」
            ];

            // 隨機從多種選項中挑選一個
            const selected = options[Math.floor(Math.random() * options.length)];
            document.getElementById('result').innerText = `🎉 推薦你喝：${selected}！`;
        }
    </script>

</body>
</html>
