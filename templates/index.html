<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrinkHelper 線上點餐系統</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- 頁面頂端醒目警示 -->
    <div class="alert alert-danger text-center m-0 rounded-0 fw-bold fs-5 shadow-sm">
        每筆線上訂單最多35杯，超過35杯請撥打電話訂購，電話：0900-878787
    </div>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center py-3">
                        <h2 class="mb-0">🥤 DrinkHelper 智慧點餐</h2>
                    </div>
                    <div class="card-body p-4">
                        
                        <!-- AI 推薦精靈區塊 -->
                        <div class="p-3 mb-4 bg-info bg-opacity-10 border border-info rounded">
                            <h5 class="text-primary mb-3">✨ AI 口感推薦精靈</h5>
                            <div class="mb-3">
                                <label class="form-label">1. 您今天想要的感受/口感？</label>
                                <input type="text" id="ai-feel" class="form-control" placeholder="例如：清爽解渴、酸甜開胃、咀嚼口感...">
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">2. 選擇甜度</label>
                                    <select id="ai-sugar" class="form-select">
                                        <option value="無糖">無糖</option>
                                        <option value="微糖">微糖</option>
                                        <option value="少糖">少糖</option>
                                        <option value="半糖">半糖</option>
                                        <option value="全糖">全糖</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">3. 選擇冰塊</label>
                                    <select id="ai-ice" class="form-select">
                                        <option value="去冰">去冰</option>
                                        <option value="微冰">微冰</option>
                                        <option value="少冰">少冰</option>
                                        <option value="正常冰">正常冰</option>
                                    </select>
                                </div>
                            </div>
                            <button type="button" class="btn btn-primary w-100" onclick="getRecommendation()">取得專屬推薦</button>
                            <div id="recommendation-result" class="mt-3 text-success fw-bold text-center"></div>
                        </div>

                        <!-- 點餐表單 -->
                        <form id="order-form">
                            <div class="mb-3">
                                <label class="form-label">訂購人姓名 (必填，中英文，最多30字)</label>
                                <input type="text" name="customer_name" id="customer_name" class="form-control" required maxlength="30">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">選擇飲料 (20款任選)</label>
                                <select name="drink_name" id="drink_name" class="form-select" required>
                                    {% for drink in drinks %}
                                    <option value="{{ drink.name }}" data-price="{{ drink.price }}">{{ drink.name }} - ${{ drink.price }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">甜度</label>
                                    <select name="sugar" id="form-sugar" class="form-select">
                                        <option value="無糖">無糖</option>
                                        <option value="微糖" selected>微糖</option>
                                        <option value="少糖">少糖</option>
                                        <option value="半糖">半糖</option>
                                        <option value="全糖">全糖</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">冰塊</label>
                                    <select name="ice" id="form-ice" class="form-select">
                                        <option value="去冰">去冰</option>
                                        <option value="微冰" selected>微冰</option>
                                        <option value="少冰">少冰</option>
                                        <option value="正常冰">正常冰</option>
                                    </select>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">杯型</label>
                                    <select name="size" class="form-select">
                                        <option value="中杯">中杯</option>
                                        <option value="大杯">大杯</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">加料</label>
                                    <select name="topping" class="form-select">
                                        <option value="無">無</option>
                                        <option value="珍珠">珍珠</option>
                                        <option value="椰果">椰果</option>
                                        <option value="仙草">仙草</option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">訂購杯數 (1 ~ 35杯)</label>
                                <select name="quantity" class="form-select" required>
                                    {% for i in range(1, 36) %}
                                    <option value="{{ i }}">{{ i }} 杯</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">備註</label>
                                <input type="text" name="notes" class="form-control" placeholder="例如：少冰、不要太甜等">
                            </div>

                            <button type="submit" class="btn btn-success w-100 py-2 fs-5">確認送出訂單</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function getRecommendation() {
            const sugar = document.getElementById('ai-sugar').value;
            const ice = document.getElementById('ai-ice').value;
            
            fetch('/api/recommend', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sugar: sugar, ice: ice })
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('recommendation-result').innerText = `💡 AI 推薦結果：${data.recommended_drink} ($${data.price})`;
                // 自動帶入表單選擇
                const drinkSelect = document.getElementById('drink_name');
                drinkSelect.value = data.recommended_drink;
                document.getElementById('form-sugar').value = sugar;
                document.getElementById('form-ice').value = ice;
            });
        }

        document.getElementById('order-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            
            fetch('/order', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert('訂單建立成功！將前往狀態查詢頁面。');
                    window.location.href = `/order/${data.token}`;
                } else {
                    alert(data.error);
                }
            })
            .catch(err => alert('送單失敗，請稍後再試'));
        });
    </script>
</body>
</html>
