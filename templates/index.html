
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrinkHelper｜智慧飲料店</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --coffee: #6F4E37;
            --dark-coffee: #493323;
            --latte: #A98467;
            --caramel: #DDB892;
            --cream: #F5EBE0;
            --light: #FBF8F4;
            --beige: #E3D5CA;
            --text: #493B32;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--light);
            color: var(--text);
            font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
        }

        /* 頂部警示 */
        .notice {
            background: #A65D57;
            color: white;
            text-align: center;
            padding: 13px 10px;
            font-weight: bold;
            font-size: 15px;
        }

        /* 主容器 */
        .main-container {
            max-width: 850px;
            margin: 45px auto;
            padding: 0 15px;
        }

        /* 主卡片 */
        .main-card {
            border: none;
            border-radius: 22px;
            overflow: hidden;
            background: #FFFFFF;
            box-shadow: 0 8px 30px rgba(111, 78, 55, 0.12);
        }

        /* 標題 */
        .header {
            background: linear-gradient(135deg, #6F4E37, #A98467);
            color: white;
            text-align: center;
            padding: 30px 15px;
        }

        .header h2 {
            font-size: 27px;
            font-weight: 800;
            letter-spacing: 2px;
            margin: 0;
        }

        .header p {
            margin: 9px 0 0;
            font-size: 13px;
            color: #F5EBE0;
            letter-spacing: 1px;
        }

        .card-content {
            padding: 30px;
        }

        /* AI 推薦區 */
        .ai-box {
            background: linear-gradient(135deg, #FBF8F4, #F5EBE0);
            border: 1px solid #E3D5CA;
            border-radius: 18px;
            padding: 23px;
            margin-bottom: 30px;
        }

        .ai-title {
            color: var(--coffee);
            font-weight: 800;
            font-size: 19px;
            margin-bottom: 20px;
        }

        /* 區塊標題 */
        .section-title {
            color: var(--dark-coffee);
            font-size: 19px;
            font-weight: 800;
            margin-bottom: 18px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--cream);
        }

        /* 表單標籤 */
        .form-label {
            color: var(--dark-coffee);
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 8px;
        }

        /* 輸入框與下拉選單 */
        .form-control,
        .form-select {
            border: 1px solid #DCC9B8;
            border-radius: 11px;
            padding: 12px 14px;
            color: var(--text);
            background-color: #FFFEFC;
            font-size: 14px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--latte);
            box-shadow: 0 0 0 0.2rem rgba(169, 132, 103, 0.16);
        }

        /* AI 按鈕 */
        .btn-recommend {
            background: var(--coffee);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 13px;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-recommend:hover {
            background: var(--dark-coffee);
            color: white;
            transform: translateY(-2px);
        }

        /* 推薦結果 */
        .recommend-result {
            background: white;
            border-radius: 12px;
            padding: 13px;
            color: var(--coffee);
            font-weight: bold;
            text-align: center;
            min-height: 15px;
        }

        /* 點餐區 */
        .order-section {
            background: #FFFFFF;
        }

        /* 送出訂單 */
        .btn-order {
            background: linear-gradient(135deg, #A98467, #6F4E37);
            color: white;
            border: none;
            border-radius: 13px;
            padding: 15px;
            font-size: 17px;
            font-weight: 800;
            letter-spacing: 1px;
            transition: 0.2s;
        }

        .btn-order:hover {
            background: var(--dark-coffee);
            color: white;
            transform: translateY(-2px);
        }

        .btn-order:disabled,
        .btn-recommend:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        /* 底部 */
        .footer {
            text-align: center;
            color: #A98467;
            font-size: 12px;
            padding: 20px 0 0;
        }

        /* 手機版 */
        @media (max-width: 576px) {
            .main-container {
                margin: 22px auto;
            }

            .card-content {
                padding: 20px 16px;
            }

            .header {
                padding: 25px 12px;
            }

            .header h2 {
                font-size: 22px;
            }

            .ai-box {
                padding: 17px;
            }

            .notice {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <!-- 頂部警示 -->
    <div class="notice">
        每筆線上訂單最多35杯，超過35杯請電話訂購：0900-878787
    </div>

    <div class="main-container">

        <div class="main-card">

            <!-- 網頁標題 -->
            <div class="header">
                <h2>🥤 DrinkHelper</h2>
                <p>讓每一杯飲料，都剛好符合你的喜好</p>
            </div>

            <div class="card-content">

                <!-- AI 推薦區 -->
                <div class="ai-box">

                    <div class="ai-title">
                        ✨ AI 口感推薦精靈
                    </div>

                    <!-- 口感 -->
                    <div class="mb-3">
                        <label class="form-label">
                            1. 您今天想要的感受／口感？
                        </label>

                        <select id="ai-feel" class="form-select" required>
                            <option value="">請選擇口感</option>
                            <option value="清爽解渴">清爽解渴</option>
                            <option value="酸甜開胃">酸甜開胃</option>
                            <option value="茶香濃郁">茶香濃郁</option>
                            <option value="香醇奶味">香醇奶味</option>
                            <option value="咀嚼口感">咀嚼口感</option>
                        </select>
                    </div>

                    <div class="row">

                        <!-- 甜度 -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">2. 選擇甜度</label>

                            <select id="ai-sugar" class="form-select">
                                <option value="無糖">無糖</option>
                                <option value="微糖">微糖</option>
                                <option value="少糖">少糖</option>
                                <option value="半糖">半糖</option>
                                <option value="全糖">全糖</option>
                            </select>
                        </div>

                        <!-- 冰塊 -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">3. 選擇冰塊</label>

                            <select id="ai-ice" class="form-select">
                                <option value="去冰">去冰</option>
                                <option value="微冰">微冰</option>
                                <option value="少冰">少冰</option>
                                <option value="正常冰">正常冰</option>
                            </select>
                        </div>

                    </div>

                    <button
                        type="button"
                        id="recommend-btn"
                        class="btn btn-recommend w-100"
                        onclick="getRecommendation()">
                        ✨ 取得專屬推薦
                    </button>

                    <div id="recommendation-result" class="recommend-result mt-3"></div>

                </div>

                <!-- 點餐區 -->
                <div class="order-section">

                    <div class="section-title">
                        🧋 線上點餐
                    </div>

                    <form id="order-form">

                        <!-- 姓名 -->
                        <div class="mb-3">
                            <label class="form-label">
                                訂購人姓名（必填，最多30字）
                            </label>

                            <input
                                type="text"
                                name="customer_name"
                                id="customer_name"
                                class="form-control"
                                required
                                maxlength="30"
                                placeholder="請輸入您的姓名">
                        </div>

                        <!-- 飲料 -->
                        <div class="mb-3">
                            <label class="form-label">
                                選擇飲料（20款任選）
                            </label>

                            <select
                                name="drink_name"
                                id="drink_name"
                                class="form-select"
                                required>

                                {% for drink in drinks %}
                                <option
                                    value="{{ drink.name }}"
                                    data-price="{{ drink.price }}">
                                    {{ drink.name }} - ${{ drink.price }}
                                </option>
