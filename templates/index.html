<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrinkHelper 智慧飲料店</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #fdfbf7;
            color: #4a3b32;
            font-family: "Microsoft JhengHei", sans-serif;
        }
        .header-bg {
            background-color: #8c6d53;
            color: white;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }
        .drink-card {
            background-color: #fcf4ec;
            border: 1px solid #f2e3d5;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .drink-card:hover {
            background-color: #f2e1cf;
            transform: translateY(-2px);
        }
        .card {
            border: none;
            border-radius: 16px;
            background-color: #ffffff;
            box-shadow: 0 4px 15px rgba(140, 109, 83, 0.08);
        }
        .btn-primary {
            background-color: #8c6d53;
            border-color: #8c6d53;
        }
        .btn-primary:hover {
            background-color: #735741;
            border-color: #735741;
        }
        .btn-success {
            background-color: #6b8c63;
            border-color: #6b8c63;
        }
        .btn-success:hover {
            background-color: #587552;
            border-color: #587552;
        }
        .feel-btn {
            margin: 3px;
            border-radius: 20px;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .feel-btn.active {
            background-color: #8c6d53 !important;
            color: white !important;
            border-color: #8c6d53 !important;
        }
    </style>
</head>
<body>
    <!-- 頁面頂端醒目警示 -->
    <div class="alert alert-danger text-center m-0 rounded-0 fw-bold fs-6 shadow-sm">
        每筆線上訂單最多35杯，超過35杯請電話訂購：0900-878787
    </div>

    <!-- 頂部標題區塊 -->
    <div class="header-bg text-center py-4 px-3 mb-4 shadow-sm">
        <h2 class="fw-bold mb-1">🥤 DrinkHelper 智慧飲料店</h2>
        <p class="mb-0 text-light opacity-75">找到最適合你的專屬飲料！</p>
    </div>

    <div class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                
                <!-- 飲料菜單預覽區塊 -->
                <div class="card p-4 mb-4">
                    <h4 class="fw-bold mb-3" style="color: #6e523b;">🧋 飲料菜單 <small class="fs-6 text-muted fw-normal">(點擊可直接帶入下方點餐)</small></h4>
                    <div class="row g-3" id="menu-container">
                        <!-- 由 JavaScript 自動渲染 20 款飲料 -->
                    </div>
                </div>

                <div class="card shadow p-4">
                    <!-- AI 推薦精靈區塊 -->
                    <div class="p-3 mb-4 border rounded-3" style="background-color: #fcf8f2; border-color: #ebd9c8 !important;">
                        <h5 class="fw-bold mb-3" style="color: #6e523b;">✨ AI 口感推薦精靈</h5>
                        <div class="mb-3">
                            <label class="form-label fw-semibold mb-2">1. 點選您今天想要的感受/口感：</label>
                            <div id="feel-buttons" class="d-flex flex-wrap gap-1 mb-2">
                                <button type="button" class="btn btn-outline-secondary feel-btn active" onclick="selectFeel(this, '清爽解渴')">🌿 清爽解渴</button>
                                <button type="button" class="btn btn-outline-secondary feel-btn" onclick="selectFeel(this, '酸甜開胃')">🍋 酸甜開胃</button>
                                <button type="button" class="btn btn-outline-secondary feel-btn" onclick="selectFeel(this, '茶香回甘')">🍃 茶香回甘</button>
                                <button type="button" class="btn btn-outline-secondary feel-btn" onclick="selectFeel(this, '濃郁香醇')">🥛 濃郁香醇</button>
                                <button type="button" class="btn btn-outline-secondary feel-btn" onclick="selectFeel(this, '水果清新')">🍊 水果清新</button>
                                <button type="button" class="btn btn-outline-secondary feel-btn" onclick="selectFeel(this, '咀嚼口感')">🧋 咀嚼口感</button>
                                <button type="button" class="btn btn-outline-secondary feel-btn" onclick="selectFeel(this, '想喝甜的')">🍯 想喝甜的</button>
                            </div>
                            <input type="hidden" id="ai-feel" value="清爽解渴">
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">2. 選擇甜度</label>
                                <select id="ai-sugar" class="form-select">
                                    <option value="無糖">無糖</option>
                                    <option value="微糖" selected>微糖</option>
                                    <option value="少糖">少糖</option>
                                    <option value="半糖">半糖</option>
                                    <option value="全糖">全糖</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">3. 選擇冰塊</label>
                                <select id="ai-ice" class="form-select">
                                    <option value="去冰">去冰</option>
                                    <option value="微冰" selected>微冰</option>
                                    <option value="少冰">少冰</option>
                                    <option value="正常冰">正常冰</option>
                                </select>
                            </div>
                        </div>
                        <button type="button" class="btn btn-primary w-100 fw-bold" onclick="getRecommendation()">取得專屬推薦</button>
                        <div id="recommendation-result" class="mt-3 text-success fw-bold text-center"></div>
                    </div>

                    <!-- 點餐表單 -->
                    <form id="order-form">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">訂購人姓名 (必填，中英文，最多30字)</label>
                            <input type="text" name="customer_name" id="customer_name" class="form-control" required maxlength="30" placeholder="請輸入您的姓名">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">選擇飲料 (20款任選)</label>
                            <select name="drink_name" id="drink_name" class="form-select" required>
                                <!-- 由 JavaScript 自動渲染 -->
                            </select>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">甜度</label>
                                <select name="sugar" id="form-sugar" class="form-select">
                                    <option value="無糖">無糖</option>
                                    <option value="微糖" selected>微糖</option>
                                    <option value="少糖">少糖</option>
                                    <option value="半糖">半糖</option>
                                    <option value="全糖">全糖</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">冰塊</label>
                                <select name="ice" id="form-ice" class="form-select">
                                    <option value="去冰">去冰</option>
                                    <option value="微冰" selected>微冰</option>
                                    <option value="少冰">少冰</option>
                                    <option value="正常冰">正常冰</option>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">杯型</label>
                                <select name="size" class="form-select">
                                    <option value="中杯">中杯</option>
                                    <option value="大杯">大杯 (+10元)</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">加料</label>
                                <select name="topping" class="form-select">
                                    <option value="無">無</option>
                                    <option value="珍珠">珍珠 (+10元)</option>
                                    <option value="椰果">椰果 (+10元)</option>
                                    <option value="仙草">仙草 (+10元)</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">訂購杯數 (1 ~ 35杯)</label>
                            <select name="quantity" id="quantity-select" class="form-select" required>
                                <!-- 由 JavaScript 自動渲染 1~35 -->
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">備註</label>
                            <input type="text" name="notes" class="form-control" placeholder="例如：少冰、不要太甜等">
                        </div>

                        <button type="submit" class="btn btn-success w-100 py-2 fs-5 fw-bold">確認送出訂單</but
