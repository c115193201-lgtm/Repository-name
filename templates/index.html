<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrinkHelper 智慧飲料店</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #fdfbf7;
            color: #4a3b32;
            font-family: "Microsoft JhengHei", sans-serif;
        }
        .header-bg {
            background-color: #8c6d53;
            color: white;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }
        .drink-card {
            background-color: #fcf4ec;
            border: 1px solid #f2e3d5;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .drink-card:hover {
            background-color: #f2e1cf;
            transform: translateY(-2px);
        }
        .card {
            border: none;
            border-radius: 16px;
            background-color: #ffffff;
            box-shadow: 0 4px 15px rgba(140, 109, 83, 0.08);
        }
        .btn-primary {
            background-color: #8c6d53;
            border-color: #8c6d53;
        }
        .btn-primary:hover {
            background-color
                <script>
        const drinksData = [
            { name: "青檸烏龍", price: 45 }, { name: "桂花青茶", price: 35 },
            { name: "四季春茶", price: 30 }, { name: "冷泡金萱", price: 40 },
            { name: "珍珠奶茶", price: 50 }, { name: "黑糖鮮奶", price: 65 },
            { name: "芋頭鮮奶", price: 70 }, { name: "焦糖奶茶", price: 55 },
            { name: "金桔檸檬", price: 50 }, { name: "百香果綠", price: 50 },
            { name: "梅子綠茶", price: 40 }, { name: "鮮橙綠茶", price: 60 },
            { name: "葡萄柚綠", price: 60 }, { name: "水蜜桃青茶", price: 55 },
            { name: "芒果綠茶", price: 55 }, { name: "荔枝烏龍", price: 50 },
            { name: "草莓果茶", price: 65 }, { name: "冬瓜檸檬", price: 45 },
            { name: "仙草凍奶茶", price: 55 }, { name: "椰果百香綠", price: 55 }
        ];

        window.onload = function() {
            const menuContainer = document.getElementById('menu-container');
            const drinkSelect = document.getElementById('drink_name');
            const qtySelect = document.getElementById('quantity-select');

            drinksData.forEach(d => {
                menuContainer.innerHTML += `
                    <div class="col-6 col-md-4">
                        <div class="drink-card p-3 text-center shadow-sm" onclick="pickDrink('${d.name}')">
                            <div class="fw-bold fs-6 mb-1" style="color: #4a3b32;">${d.name}</div>
                            <div class="fw-bold" style="color: #8c6d53;">$${d.price}</div>
                        </div>
                    </div>
                `;
                drinkSelect.innerHTML += `<option value="${d.name}">${d.name} - $${d.price}</option>`;
            });

            for (let i = 1; i <= 35; i++) {
                qtySelect.innerHTML += `<option value="${i}">${i} 杯</option>`;
            }
        };

        function pickDrink(name) {
            document.getElementById('drink_name').value = name;
            document.getElementById('order-form').scrollIntoView({ behavior: 'smooth' });
        }

        function selectFeel(btn, feelValue) {
            document.querySelectorAll('.feel-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            document.getElementById('ai-feel').value = feelValue;
        }

        function getRecommendation() {
            const feel = document.getElementById('ai-feel').value;
            const sugar = document.getElementById('ai-sugar').value;
            const ice = document.getElementById('ai-ice').value;
            
            const recommendationMap = {
                '清爽解渴': '青檸烏龍',
                '酸甜開胃': '金桔檸檬',
                '茶香回甘': '桂花青茶',
                '濃郁香醇': '黑糖鮮奶',
                '水果清新': '鮮橙綠茶',
                '咀嚼口感': '珍珠奶茶',
                '想喝甜的': '焦糖奶茶'
            };

            const recommendedDrink = recommendationMap[feel] || '四季春茶';
            const found = drinksData.find(d => d.name === recommendedDrink);
            const price = found ? found.price : 30;

            document.getElementById('recommendation-result').innerHTML = `💡 專屬推薦 [${feel}]：<b>${recommendedDrink}</b> ($${price})`;
            
            document.getElementById('drink_name').value = recommendedDrink;
            document.getElementById('form-sugar').value = sugar;
            document.getElementById('form-ice').value = ice;
        }

        document.getElementById('order-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            
            fetch('/order', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert('訂單建立成功！將前往狀態查詢頁面。');
                    window.location.href = `/order/${data.token}`;
                } else {
                    alert(data.error);
                }
            })
            .catch(() => alert('送單失敗，請確認後端連線狀態'));
        });
    </script>
</body>
</html>
