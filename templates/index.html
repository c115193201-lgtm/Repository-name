<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrinkHelper 智慧飲料店</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #fdfbf7;
            color: #4a3b32;
        }
        .header-bg {
            background-color: #8c6d53;
            color: white;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }
        .drink-card {
            background-color: #fcf4ec;
            border: 1px solid #f2e3d5;
            border-radius: 12px;
            transition: all 0.2s;
        }
        .drink-card:hover {
            background-color: #f7eadc;
        }
        .card {
            border: none;
            border-radius: 16px;
            background-color: #ffffff;
            box-shadow: 0 4px 15px rgba(140, 109, 83, 0.08);
        }
        .btn-primary {
            background-color: #8c6d53;
            border-color: #8c6d53;
        }
        .btn-primary:hover {
            background-color: #735741;
            border-color: #735741;
        }
        .btn-success {
            background-color: #6b8c63;
            border-color: #6b8c63;
        }
        .btn-success:hover {
            background-color: #587552;
            border-color: #587552;
        }
        .feel-btn {
            margin: 3px;
            border-radius: 20px;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .feel-btn.active {
            background-color: #8c6d53;
            color: white;
            border-color: #8c6d53;
        }
    </style>
</head>
<body>
    <!-- 頁面頂端醒目警示 -->
    <div class="alert alert-danger text-center m-0 rounded-0 fw-bold fs-6 shadow-sm">
        每筆線上訂單最多35杯，超過35杯請電話訂購，電話專線：0900-878787
    </div>

    <!-- 頂部標題區塊 -->
    <div class="header-bg text-center py-4 px-3 mb-4 shadow-sm">
