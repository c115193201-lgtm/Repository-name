
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DrinkHelper 智慧飲料店</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background-color: #fdfbf7;
    color: #4a3b32;
    font-family: "Microsoft JhengHei", sans-serif;
}
.header-bg {
    background-color: #8c6d53;
    color: white;
    border-bottom-left-radius: 20px;
    border-bottom-right-radius: 20px;
}
.drink-card {
    background-color: #fcf4ec;
    border: 1px solid #f2e3d5;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s;
}
.drink-card:hover {
    background-color: #f2e1cf;
    transform: translateY(-2px);
}
.card {
    border: none;
    border-radius: 16px;
    background-color: white;
    box-shadow: 0 4px 15px rgba(140,109,83,0.08);
}
.btn-primary {
    background-color: #8c6d53;
    border-color: #8c6d53;
}
.btn-primary:hover {
    background-color: #735741;
    border-color: #735741;
}
.btn-success {
    background-color: #6b8c63;
    border-color: #6b8c63;
}
.btn-success:hover {
    background-color: #587552;
    border-color: #587552;
}
.form-select:focus, .form-control:focus {
    border-color: #b99a7b;
    box-shadow: 0 0 0 0.2rem rgba(140,109,83,0.15);
}
#recommendation-result {
    background-color: #f5eee5;
    color: #6e523b;
    border-radius: 12px;
    padding: 14px;
    min-height: 55px;
}
</style>
</head>

<body>

<div class="alert alert-danger text-center m-0 rounded-0 fw-bold fs-6 shadow-sm">
每筆線上訂單最多35杯，超過35杯請電話訂購：0900-878787
</div>

<div class="header-bg text-center py-4 px-3 mb-4 shadow-sm">
    <h2 class="fw-bold mb-1">🥤 DrinkHelper 智慧飲料店</h2>
    <p class="mb-0 text-light opacity-75">找到最適合你的專屬飲料！</p>
</div>

<div class="container mb-5">
<div class="row justify-content-center">
<div class="col-md-8">

<div class="card p-4 mb-4">
    <h4 class="fw-bold mb-3" style="color:#6e523b;">
        🧋 飲料菜單
        <small class="fs-6 text-muted fw-normal">(點擊可直接帶入下方點餐)</small>
    </h4>
    <div class="row g-3" id="menu-container"></div>
</div>

<div class="card shadow p-4">
<div class="p-3 mb-4 border rounded-3"
     style="background-color:#fcf8f2;border-color:#ebd9c8 !important;">

<h5 class="fw-bold mb-3" style="color:#6e523b;">
✨ AI 口感推薦精靈
</h5>

<div class="mb-3">
<label class="form-label fw-semibold mb-2">
1. 選擇您今天想要的感受／口感
</label>
<select id="ai-feel" class="form-select">
    <option value="清爽解渴">🌿 清爽解渴</option>
    <option value="酸甜開胃">🍋 酸甜開胃</option>
    <option value="茶香回甘">🍃 茶香回甘</option>
    <option value="濃郁香醇">🥛 濃郁香醇</option>
    <option value="水果清新">🍊 水果清新</option>
    <option value="咀嚼口感">🧋 咀嚼口感</option>
    <option value="想喝甜的">🍯 想喝甜的</option>
</select>
</div>

<div class="row">
<div class="col-md-6 mb-3">
<label class="form-label fw-semibold">2. 選擇甜度</label>
<select id="ai-sugar" class="form-select">
    <option value="無糖">無糖</option>
    <option value="微糖" selected>微糖</option>
    <option value="少糖">少糖</option>
    <option value="半糖">半糖</option>
    <option value="全糖">全糖</option>
</select>
</div>

<div class="col-md-6 mb-3">
<label class="form-label fw-semibold">3. 選擇冰塊</label>
<select id="ai-ice" class="form-select">
    <option value="去冰">去冰</option>
    <option value="微冰" selected>微冰</option>
    <option value="少冰">少冰</option>
    <option value="正常冰">正常冰</option>
</select>
</div>
</div>

<button type="button" id="recommend-button"
        class="btn btn-primary w-100 fw-bold py-2">
取得專屬推薦
</button>

<div id="recommendation-result" class="mt-3 text-center fw-bold">
請選擇口感，系統將為您推薦飲料。
</div>
</div>
<!-- 訂單表單 -->
<form id="order-form">

    <div class="mb-3">
        <label class="form-label fw-semibold">
            訂購人姓名 (必填，中英文，最多30字)
        </label>
        <input type="text"
               name="customer_name"
               id="customer_name"
               class="form-control"
               required
               maxlength="30"
               placeholder="請輸入您的姓名">
    </div>

    <div class="mb-3">
        <label class="form-label fw-semibold">
            選擇飲料 (20款任選)
        </label>
        <select name="drink_name"
                id="drink_name"
                class="form-select"
                required>
        </select>
    </div>

    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label fw-semibold">甜度</label>
            <select name="sugar" id="form-sugar" class="form-select">
                <option value="無糖">無糖</option>
                <option value="微糖" selected>微糖</option>
                <option value="少糖">少糖</option>
                <option value="半糖">半糖</option>
                <option value="全糖">全糖</option>
            </select>
        </div>

        <div class="col-md-6 mb-3">
            <label class="form-label fw-semibold">冰塊</label>
            <select name="ice" id="form-ice" class="form-select">
                <option value="去冰">去冰</option>
                <option value="微冰" selected>微冰</option>
                <option value="少冰">少冰</option>
                <option value="正常冰">正常冰</option>
            </select>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label fw-semibold">杯型</label>
            <select name="size" class="form-select">
                <option value="中杯">中杯</option>
                <option value="大杯">大杯 (+10元)</option>
            </select>
        </div>

        <div class="col-md-6 mb-3">
            <label class="form-label fw-semibold">加料</label>
            <select name="topping" class="form-select">
                <option value="無">無</option>
                <option value="珍珠">珍珠 (+10元)</option>
                <option value="椰果">椰果 (+10元)</option>
                <option value="仙草">仙草 (+10元)</option>
            </select>
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label fw-semibold">
            訂購杯數 (1 ~ 35杯)
        </label>
        <select name="quantity"
                id="quantity-select"
                class="form-select"
                required>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label fw-semibold">備註</label>
        <input type="text"
               name="notes"
               class="form-control"
               placeholder="例如：少冰、不要太甜等">
    </div>

    <button type="submit"
            class="btn btn-success w-100 py-2 fs-5 fw-bold">
        確認送出訂單
    </button>

</form>

</div>
</div>
</div>
</div>

<!-- 第3段的 JavaScript 會接在這裡 -->
<script>
const drinksData = [
    {name:"青檸烏龍",price:45},
    {name:"桂花青茶",price:35},
    {name:"四季春茶",price:30},
    {name:"冷泡金萱",price:40},
    {name:"珍珠奶茶",price:50},
    {name:"黑糖鮮奶",price:65},
    {name:"芋頭鮮奶",price:70},
    {name:"焦糖奶茶",price:55},
    {name:"金桔檸檬",price:50},
    {name:"百香果綠",price:50},
    {name:"梅子綠茶",price:40},
    {name:"鮮橙綠茶",price:60},
    {name:"葡萄柚綠",price:60},
    {name:"水蜜桃青茶",price:55},
    {name:"芒果綠茶",price:55},
    {name:"荔枝烏龍",price:50},
    {name:"草莓果茶",price:65},
    {name:"冬瓜檸檬",price:45},
    {name:"仙草凍奶茶",price:55},
    {name:"椰果百香綠",price:55}
];

const recommendationMap = {
    "清爽解渴":"青檸烏龍",
    "酸甜開胃":"金桔檸檬",
    "茶香回甘":"桂花青茶",
    "濃郁香醇":"黑糖鮮奶",
    "水果清新":"鮮橙綠茶",
    "咀嚼口感":"珍珠奶茶",
    "想喝甜的":"焦糖奶茶"
};

// AI 推薦功能
function getRecommendation() {
    const feel = document.getElementById("ai-feel").value;
    const sugar = document.getElementById("ai-sugar").value;
    const ice = document.getElementById("ai-ice").value;

    const recommendedDrink = recommendationMap[feel] || "四季春茶";

    const found = drinksData.find(d => d.name === recommendedDrink);
    const price = found ? found.price : 30;

    document.getElementById("recommendation-result").innerHTML = `
        💡 專屬推薦<br>
        <span style="font-size:24px;color:#8c6d53;">
            ${recommendedDrink}
        </span>
        <br>
        <span style="font-size:15px;color:#806b58;">
            ${feel}・${sugar}・${ice}
        </span>
        <br>
        價格：$${price}
        <br>
        <span style="font-size:13px;color:#6b8c63;">
            已幫您帶入下方點餐欄位！
        </span>
    `;

    document.getElementById("drink_name").value = recommendedDrink;
    document.getElementById("form-sugar").value = sugar;
    document.getElementById("form-ice").value = ice;
}

// 點擊菜單選擇飲料
function pickDrink(name) {
    document.getElementById("drink_name").value = name;

    document.getElementById("order-form").scrollIntoView({
        behavior:"smooth"
    });
}

// 網頁載入完成後執行
document.addEventListener("DOMContentLoaded", function() {

    const menuContainer = document.getElementById("menu-container");
    const drinkSelect = document.getElementById("drink_name");
    const qtySelect = document.getElementById("quantity-select");

    // 建立20款飲料
    drinksData.forEach(function(d) {

        const menuItem = document.createElement("div");
        menuItem.className = "col-6 col-md-4";

        menuItem.innerHTML = `
            <div class="drink-card p-3 text-center shadow-sm">
                <div class="fw-bold fs-6 mb-1">
                    ${d.name}
                </div>
                <div class="fw-bold" style="color:#8c6d53;">
                    $${d.price}
                </div>
            </div>
        `;

        menuItem.querySelector(".drink-card").addEventListener("click", function() {
            pickDrink(d.name);
        });

        menuContainer.appendChild(menuItem);

        const option = document.createElement("option");
        option.value = d.name;
        option.textContent = `${d.name} - $${d.price}`;
        drinkSelect.appendChild(option);
    });

    // 建立1至35杯選項
    for (let i = 1; i <= 35; i++) {
        const option = document.createElement("option");
        option.value = i;
        option.textContent = `${i} 杯`;
        qtySelect.appendChild(option);
    }

    // 口感、甜度、冰塊改變時自動推薦
    document.getElementById("ai-feel").addEventListener("change", getRecommendation);
    document.getElementById("ai-sugar").addEventListener("change", getRecommendation);
    document.getElementById("ai-ice").addEventListener("change", getRecommendation);

    // 保留手動推薦按鈕
    document.getElementById("recommend-button").addEventListener("click", getRecommendation);

    // 頁面載入就顯示預設推薦
    getRecommendation();

    // 訂單送出
    document.getElementById("order-form").addEventListener("submit", function(e) {

        e.preventDefault();

        const formData = new FormData(this);

        fetch("/order", {
            method:"POST",
            body:formData
        })
        .then(function(res) {
            if (!res.ok) {
                throw new Error("伺服器回應錯誤");
            }
            return res.json();
        })
        .then(function(data) {

            if (data.success) {
                alert("訂單建立成功！將前往狀態查詢頁面。");
                window.location.href = "/order/" + data.token;
            } else {
                alert(data.error || "訂單建立失敗");
            }

        })
        .catch(function(error) {
            console.error("送單錯誤：", error);
            alert("送單失敗，請確認後端連線狀態");
        });

    });

});
</script>

</body>
</html>
