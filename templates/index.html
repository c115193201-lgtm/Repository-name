<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>DrinkHelper - 智慧手搖飲訂閱平台</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f9fa;
            margin: 0;
            padding: 20px;
            color: #2c3e50;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            font-weight: bold;
            margin-right: 10px;
        }
        select, button {
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #3498db;
            color: white;
            cursor: pointer;
            border: none;
        }
        button:hover {
            background-color: #2980b9;
        }
        #result {
            margin-top: 15px;
            font-weight: bold;
            color: #c0392b;
            font-size: 20px;
            background-color: #fadbd8;
            padding: 15px;
            border-radius: 5px;
            border-left: 5px solid #e74c3c;
        }
        .menu-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .menu-table th, .menu-table td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
        .menu-table th {
            background-color: #34495e;
            color: white;
        }
    </style>
</head>
<body>

    <div class="container">
        <header style="text-align: center; margin-bottom: 30px;">
            <h1>🥤 DrinkHelper 智慧手搖飲訂閱</h1>
            <p>為你量身打造的專屬手搖飲推薦與智慧菜單系統！</p>
        </header>

        <!-- 互動推薦區塊 -->
        <div class="card">
            <h3>🔍 智慧命定推薦（自訂甜度冰塊）</h3>
            <div class="form-group">
                <label for="sweetness">選擇甜度：</label>
                <select id="sweetness">
                    <option value="正常糖">正常糖</option>
                    <option value="少糖">少糖</option>
                    <option value="半糖">半糖</option>
                    <option value="微糖">微糖</option>
                    <option value="無糖">無糖</option>
                </select>
            </div>
            <div class="form-group">
                <label for="ice">選擇冰塊：</label>
                <select id="ice">
                    <option value="正常冰">正常冰</option>
                    <option value="少冰">少冰</option>
                    <option value="微冰">微冰</option>
                    <option value="去冰">去冰</option>
                    <option value="溫熱飲">溫熱飲</option>
                </select>
            </div>
            <button type="button" onclick="recommendDrink()">幫我推薦飲品！</button>
            
            <!-- 推薦結果顯示區 -->
            <div id="result">點擊上方按鈕，立刻為您推薦命定手搖飲！</div>
        </div>

        <!-- 完整豐富菜單區塊 -->
        <div class="card">
            <h3>📋 智慧連鎖手搖飲精選菜單</h3>
            <table class="menu-table">
                <tr>
                    <th>分類</th>
                    <th>飲品名稱</th>
                    <th>推薦甜度/冰塊</th>
                    <th>參考價格</th>
                </tr>
                <tr>
                    <td>經典特調</td>
                    <td>招牌多多綠</td>
                    <td>半糖 / 少冰</td>
                    <td>$55</td>
                </tr>
                <tr>
                    <td>咀嚼系</td>
                    <td>芋頭鮮奶波波</td>
                    <td>微糖 / 微冰</td>
                    <td>$65</td>
                </tr>
                <tr>
                    <td>咀嚼系</td>
                    <td>黑糖珍珠鮮奶</td>
                    <td>正常糖 / 正常冰</td>
                    <td>$60</td>
                </tr>
                <tr>
                    <td>清爽茶飲</td>
                    <td>四季春青茶 + 珍珠</td>
                    <td>無糖 / 去冰</td>
                    <td>$45</td>
                </tr>
                <tr>
                    <td>濃郁奶茶</td>
                    <td>鐵觀音拿鐵</td>
                    <td>微糖 / 少冰</td>
                    <td>$55</td>
                </tr>
                <tr>
                    <td>果茶特調</td>
                    <td>百香雙響炮</td>
                    <td>少糖 / 正常冰</td>
                    <td>$65</td>
                </tr>
            </table>
        </div>
    </div>

    <script>
        function recommendDrink() {
            const sweet = document.getElementById('sweetness').value;
            const ice = document.getElementById('ice').value;
            
            // 包含多多綠在內的飲料清單
            const drinks = [
                "招牌多多綠",
                "四季春青茶 + 珍珠",
                "芋頭鮮奶波波",
                "鐵觀音拿鐵",
                "黑糖珍珠鮮奶",
                "百香雙響炮"
            ];

            // 隨機挑選一個
            const randomDrink = drinks[Math.floor(Math.random() * drinks.length)];
            
            // 強制將結果寫入網頁
            const resultBox = document.getElementById('result');
            resultBox.innerText = `🎉 推薦你喝：${sweet}、${ice} 的「${randomDrink}」！`;
        }
    </script>

</body>
</html>
