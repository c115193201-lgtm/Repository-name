<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrinkHelper 訂單狀態追蹤</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #fdfbf7;
            color: #4a3b32;
            font-family: "Microsoft JhengHei", sans-serif;
        }
        .header-bg {
            background-color: #8c6d53;
            color: white;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }
        .card {
            border: none;
            border-radius: 16px;
            background-color: #ffffff;
            box-shadow: 0 4px 15px rgba(140, 109, 83, 0.08);
        }
        .btn-primary {
            background-color: #8c6d53;
            border-color: #8c6d53;
        }
        .btn-primary:hover {
            background-color: #735741;
            border-color: #735741;
        }
    </style>
</head>
<body>
    <div class="header-bg text-center py-4 px-3 mb-4 shadow-sm">
        <h2 class="fw-bold mb-1">🥤 DrinkHelper 訂單狀態追蹤</h2>
        <p class="mb-0 text-light opacity-75">隨時掌握您的手搖飲製作進度</p>
    </div>

    <div class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4 text-center shadow-sm">
                    <h4 class="fw-bold mb-3" style="color: #6e523b;">訂單詳細資訊</h4>
                    
                    <div class="mb-3 text-start bg-light p-3 rounded-3">
                        <p class="mb-2"><strong>訂單編號：</strong> <span id="order-token">載入中...</span></p>
                        <p class="mb-2"><strong>訂購人：</strong> <span id="order-name">載入中...</span></p>
                        <p class="mb-2"><strong>品項：</strong> <span id="order-item">載入中...</span></p>
                        <p class="mb-2"><strong>數量：</strong> <span id="order-qty">載入中...</span> 杯</p>
                        <p class="mb-0"><strong>總金額：</strong> <span id="order-price" class="text-success fw-bold">載入中...</span></p>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">目前訂單狀態：</label>
                        <div id="order-status-badge" class="fs-4 fw-bold p-2 rounded-3 bg-warning text-dark">
                            等待店家處理中...
                        </div>
                    </div>

                    <p class="text-muted small">💡 此頁面會自動更新狀態，當店家完成製作或取消訂單時將會即時通知您。</p>
                    
                    <a href="/" class="btn btn-primary w-100 fw-bold mt-2">返回首頁繼續點餐</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 自動從網址列解析 token，防止變數未帶到導致空白
        const pathSegments = window.location.pathname.split('/');
        const token = pathSegments[pathSegments.length - 1] || "{{ token }}";
        document.getElementById('order-token').innerText = token;

        let lastStatus = "";

        function checkOrderStatus() {
            fetch(`/api/order_status/${token}`)
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        document.getElementById('order-name').innerText = data.customer_name;
                        document.getElementById('order-item').innerText = `${data.drink_name} (${data.sugar} / ${data.ice})`;
                        document.getElementById('order-qty').innerText = data.quantity;
                        document.getElementById('order-price').innerText = `$${data.total_price}`;

                        const badge = document.getElementById('order-status-badge');
                        const currentStatus = data.status;

                        if (lastStatus !== "" && lastStatus !== currentStatus) {
                            if (currentStatus === "已完成") {
                                alert("🎉 您的飲料已經製作完成囉！請憑單領取。");
                            } else if (currentStatus === "已取消") {
                                alert("❌ 很抱歉，您的訂單已被店家取消。");
                            }
                        }
                        lastStatus = currentStatus;

                        badge.innerText = currentStatus;
                        if (currentStatus === "已完成") {
                            badge.className = "fs-4 fw-bold p-2 rounded-3 bg-success text-white";
                        } else if (currentStatus === "已取消") {
                            badge.className = "fs-4 fw-bold p-2 rounded-3 bg-danger text-white";
                        } else {
                            badge.className = "fs-4 fw-bold p-2 rounded-3 bg-warning text-dark";
                        }
                    } else {
                        document.getElementById('order-status-badge').innerText = "找不到此訂單";
                    }
                })
                .catch(err => console.log('同步狀態中...'));
        }

        checkOrderStatus();
        setInterval(checkOrderStatus, 5000);
    </script>
</body>
</html>
